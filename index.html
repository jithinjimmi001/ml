<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Credit Card Fraud Detection</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 800px;
    margin: 40px auto;
    background: #f4f4f9;
    color: #222;
  }
  h1 {
    text-align: center;
  }
  #feature-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-top: 20px;
  }
  .field label {
    font-size: 11px;
    display: block;
    margin-bottom: 2px;
  }
  .field input {
    width: 100%;
    padding: 4px;
    box-sizing: border-box;
  }
  #submit-btn {
    margin-top: 20px;
    padding: 10px 20px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }
  #submit-btn:disabled {
    background: #999;
    cursor: not-allowed;
  }
  #result {
    margin-top: 20px;
    padding: 15px;
    border-radius: 6px;
    display: none;
  }
  #result.genuine {
    background: #dcfce7;
    border: 1px solid #16a34a;
  }
  #result.fraud {
    background: #fee2e2;
    border: 1px solid #dc2626;
  }
  #result.error {
    background: #fef3c7;
    border: 1px solid #d97706;
  }
</style>
</head>
<body>

<h1>Credit Card Fraud Detection</h1>
<p style="text-align:center; color:#555;">Enter transaction feature values below</p>

<div id="feature-grid">Loading fields...</div>

<button id="submit-btn">Predict</button>

<div id="result"></div>

<script>
const API_BASE = 'http://localhost:5000';
let featureNames = [];

// Fetch the list of expected features from the backend and build the form
async function loadFeatures() {
  try {
    const res = await fetch(`${API_BASE}/features`);
    const data = await res.json();
    featureNames = data.features;

    const grid = document.getElementById('feature-grid');
    grid.innerHTML = '';
    featureNames.forEach(f => {
      const div = document.createElement('div');
      div.className = 'field';
      div.innerHTML = `
        <label for="${f}">${f}</label>
        <input type="number" step="any" id="${f}" required>
      `;
      grid.appendChild(div);
    });
  } catch (err) {
    document.getElementById('feature-grid').innerHTML =
      '<p style="color:red;">Could not connect to backend. Is Flask running on port 5000?</p>';
  }
}

async function handleSubmit() {
  const btn = document.getElementById('submit-btn');
  const resultDiv = document.getElementById('result');

  const payload = {};
  for (const f of featureNames) {
    const val = document.getElementById(f).value;
    if (val === '') {
      alert(`Please fill in ${f}`);
      return;
    }
    payload[f] = val;
  }

  btn.disabled = true;
  btn.textContent = 'Predicting...';

  try {
    const res = await fetch(`${API_BASE}/predict`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    resultDiv.style.display = 'block';
    if (data.error) {
      resultDiv.className = 'error';
      resultDiv.innerHTML = `<strong>Error:</strong> ${data.error}`;
    } else {
      resultDiv.className = data.prediction === 1 ? 'fraud' : 'genuine';
      resultDiv.innerHTML = `
        <h3>Result: ${data.label}</h3>
        <p>Fraud Probability: ${(data.fraud_probability * 100).toFixed(2)}%</p>
      `;
    }
  } catch (err) {
    resultDiv.style.display = 'block';
    resultDiv.className = 'error';
    resultDiv.innerHTML = '<strong>Error:</strong> Could not reach backend.';
  }

  btn.disabled = false;
  btn.textContent = 'Predict';
}

document.getElementById('submit-btn').addEventListener('click', handleSubmit);
loadFeatures();
</script>

</body>
</html>
